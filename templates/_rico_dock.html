<aside class="rico-dock" data-rico-dock aria-label="Rico coaching dock">
    <button class="rico-dock-toggle" type="button" aria-expanded="false" aria-controls="ricoDockPanel"><img src="{{ url_for('static', filename='coqui-coach.svg') }}" alt=""><span><strong>Rico</strong><small>Ready when you are</small></span><span aria-hidden="true">⌃</span></button>
    <section class="rico-dock-panel" id="ricoDockPanel" hidden aria-labelledby="ricoDockTitle">
        <header><div><small>Your running coach</small><h2 id="ricoDockTitle">Talk to Rico</h2></div><button type="button" data-rico-close aria-label="Close Rico chat">×</button></header>
        <div class="rico-dock-thread" data-rico-thread aria-live="polite"><div class="rico-dock-message">Tell me what is on your mind, or ask what matters for today.</div></div>
        <div class="rico-dock-prompts"><button type="button" data-rico-prompt="What do you recommend for me today?">Today’s recommendation</button><button type="button" data-rico-prompt="What did you notice about my recent training?">What Rico noticed</button></div>
        <form data-rico-form><label class="sr-only" for="ricoDockQuestion">Message Rico</label><textarea id="ricoDockQuestion" name="question" rows="2" placeholder="Message Rico…" required></textarea><button type="submit">Send</button></form>
    </section>
</aside>
