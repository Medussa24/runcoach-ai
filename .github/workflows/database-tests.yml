name: Database compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runcoach_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: runcoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runcoach_test -d runcoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run complete suite
        env:
          BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          if [[ "$BACKEND" == "postgresql" ]]; then
            export RUNCOACH_TEST_POSTGRES_URL='postgresql://runcoach_test:test-only-password@127.0.0.1:5432/runcoach_test'
          fi
          python -m pytest -q
